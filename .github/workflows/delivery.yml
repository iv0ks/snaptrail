# Continous Delivery workflow.
name: Delivery

# Define the event that triggers the workflow.
# Run when a tag is pushed, build the docker image and push to ghcr.
on:
  push:
    tags:
      - "*"

# Required permission.
permissions:
  contents: read
  packages: write

# Define the jobs that run in the workflow.
jobs:
  # Job-1: Build and Push Docker Image to GHCR.
  build:
    name: Image
    uses: iv0ks/cicd-hub/.github/workflows/build-push.yml@main

  # Job-2: Scan Docker Image.
  image-scan:
    name: Image
    needs: build
    uses: iv0ks/cicd-hub/.github/workflows/image-scan.yml@main
