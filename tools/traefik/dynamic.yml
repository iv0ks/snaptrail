http:
  # Entry points define how Traefik listens for incoming requests.
  routers:
    # Snaptrail router.
    snaptrail:
      rule: "Host(`snaptrail.iv0ks.dev`)"
      entryPoints:
        - websecure
      service: snaptrail
      tls: { certResolver: namecheap }

  # Services define how Traefik forwards requests to backend servers.
  services:
    snaptrail:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5000/"
